name: Daily CH-666 Generation & Cleanup

on:
  schedule:
    - cron: '5 10 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        type: choice
        options:
          - generate
          - cleanup
          - both
      channel:
        description: 'Channel to generate (for manual generate mode)'
        required: false
        type: choice
        options:
          - all
          - CH-666
          - CH-333
          - CH-999
        default: 'all'
      count_override:
        description: 'Override articles per day (optional)'
        required: false
        type: string
      force_date:
        description: 'Force target date YYYY-MM-DD (optional)'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.11'
  GENERATION_CONFIG: ${{ github.workspace }}/config/generation.json
  AI_PROVIDERS_CONFIG: ${{ github.workspace }}/config/ai-providers.json
  CHANNELS_CONFIG: ${{ github.workspace }}/config/channels.json
  CONTENT_DIR: ${{ github.workspace }}/content

jobs:
  detect-mode:
    name: Detect Mode
    runs-on: ubuntu-latest
    outputs:
      do_generate: ${{ steps.check.outputs.do_generate }}
      do_cleanup: ${{ steps.check.outputs.do_cleanup }}
      channels: ${{ steps.check.outputs.channels }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event.inputs.mode }}" == "generate" ]]; then
            echo "do_generate=true" >> $GITHUB_OUTPUT
            echo "do_cleanup=false" >> $GITHUB_OUTPUT
            if [[ "${{ github.event.inputs.channel }}" == "all" || -z "${{ github.event.inputs.channel }}" ]]; then
              echo "channels=CH-666,CH-333,CH-999" >> $GITHUB_OUTPUT
            else
              echo "channels=${{ github.event.inputs.channel }}" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event.inputs.mode }}" == "cleanup" ]]; then
            echo "do_generate=false" >> $GITHUB_OUTPUT
            echo "do_cleanup=true" >> $GITHUB_OUTPUT
            echo "channels=" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.mode }}" == "both" ]]; then
            echo "do_generate=true" >> $GITHUB_OUTPUT
            echo "do_cleanup=true" >> $GITHUB_OUTPUT
            if [[ "${{ github.event.inputs.channel }}" == "all" || -z "${{ github.event.inputs.channel }}" ]]; then
              echo "channels=CH-666,CH-333,CH-999" >> $GITHUB_OUTPUT
            else
              echo "channels=${{ github.event.inputs.channel }}" >> $GITHUB_OUTPUT
            fi
          else
            HOUR=$(date -u +%H)
            if [[ "$HOUR" == "10" ]]; then
              echo "do_generate=true" >> $GITHUB_OUTPUT
              echo "do_cleanup=false" >> $GITHUB_OUTPUT
              echo "channels=CH-666,CH-333,CH-999" >> $GITHUB_OUTPUT
            elif [[ "$HOUR" == "03" ]]; then
              echo "do_generate=false" >> $GITHUB_OUTPUT
              echo "do_cleanup=true" >> $GITHUB_OUTPUT
              echo "channels=" >> $GITHUB_OUTPUT
            else
              echo "do_generate=false" >> $GITHUB_OUTPUT
              echo "do_cleanup=false" >> $GITHUB_OUTPUT
              echo "channels=" >> $GITHUB_OUTPUT
            fi
          fi
          echo "=== Detect Mode Result ==="
          echo "do_generate: ${{ steps.check.outputs.do_generate }}"
          echo "do_cleanup: ${{ steps.check.outputs.do_cleanup }}"
          echo "channels: ${{ steps.check.outputs.channels }}"

  generate:
    name: Generate ${{ matrix.channel }} Stories
    needs: detect-mode
    if: needs.detect-mode.outputs.do_generate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        channel: [CH-666, CH-333, CH-999]
    steps:
      - name: Check if channel should run
        id: should_run
        run: |
          CHANNELS="${{ needs.detect-mode.outputs.channels }}"
          echo "Input channels: '$CHANNELS'"
          echo "Current matrix channel: '${{ matrix.channel }}'"
          if [[ -z "$CHANNELS" ]]; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Reason: channels list is empty"
          elif [[ "$CHANNELS" == "all" ]] || [[ "$CHANNELS" == *"${{ matrix.channel }}"* ]]; then
            echo "run=true" >> $GITHUB_OUTPUT
            echo "Reason: channel in list"
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Reason: channel NOT in list"
          fi
        if: needs.detect-mode.outputs.do_generate == 'true'

      - name: Checkout repository
        if: steps.should_run.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required files
        if: steps.should_run.outputs.run == 'true'
        run: |
          set -euo pipefail
          echo "=== Repository file check ==="
          required=(
            "scripts/load_config.py"
            "scripts/determine_date.py"
            "scripts/main.py"
            "scripts/generate_images_agnes_ftp.py"
            "scripts/notify_serv00.py"
            "config/generation.json"
            "config/ai-providers.json"
            "config/channels.json"
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: required file is missing from the checked-out repository: $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Setup Python
        if: steps.should_run.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.should_run.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil pyyaml pillow python-dotenv

      - name: Load configuration
        if: steps.should_run.outputs.run == 'true'
        id: config
        env:
          GENERATION_CONFIG: ${{ env.GENERATION_CONFIG }}
          AI_PROVIDERS_CONFIG: ${{ env.AI_PROVIDERS_CONFIG }}
          CHANNELS_CONFIG: ${{ env.CHANNELS_CONFIG }}
          MATRIX_CHANNEL: ${{ matrix.channel }}
          COUNT_OVERRIDE: ${{ github.event.inputs.count_override }}
        run: |
          python scripts/load_config.py

      - name: Check if generation enabled
        if: steps.should_run.outputs.run == 'true'
        run: |
          if [[ "${{ steps.config.outputs.enabled }}" != "true" ]] || [[ "${{ steps.config.outputs.channel_enabled }}" != "true" ]]; then
            echo "Daily generation is disabled for ${{ matrix.channel }}"
            exit 0
          fi

      - name: Determine target date
        if: steps.should_run.outputs.run == 'true'
        id: date
        env:
          FORCE_DATE: ${{ github.event.inputs.force_date }}
        run: |
          python scripts/determine_date.py

      - name: Debug secrets availability
        if: steps.should_run.outputs.run == 'true'
        run: |
          echo "=== Secrets Check ==="
          echo "NVIDIA_API_KEY: ${NVIDIA_API_KEY:+SET}"
          echo "OPENAI_API_KEY: ${OPENAI_API_KEY:+SET}"
          echo "GOOGLE_API_KEY: ${GOOGLE_API_KEY:+SET}"
          echo "AGNES_API_KEY: ${AGNES_API_KEY:+SET}"
          echo "NEWSAPI_KEY: ${NEWSAPI_KEY:+SET}"
          echo "SERV00_UPDATE_URL: ${SERV00_UPDATE_URL:+SET}"
          echo "SERV00_UPDATE_TOKEN: ${SERV00_UPDATE_TOKEN:+SET}"
          echo "FTP_HOST: ${FTP_HOST:+SET}"
          echo "FTP_USER: ${FTP_USER:+SET}"
          echo "FTP_PASS: ${FTP_PASS:+SET}"
          echo "FTP_PATH: ${FTP_PATH:+SET}"
          echo "SITE_URL: ${SITE_URL:+SET}"
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SERV00_UPDATE_URL: ${{ secrets.SERV00_UPDATE_URL }}
          SERV00_UPDATE_TOKEN: ${{ secrets.SERV00_UPDATE_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Generate stories
        if: steps.should_run.outputs.run == 'true'
        id: generate
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          TARGET_ISO: ${{ steps.date.outputs.target_iso }}
          TOMORROW_ISO: ${{ steps.date.outputs.tomorrow_iso }}
          ARTICLES_PER_DAY: ${{ steps.config.outputs.articles_per_day }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SERV00_UPDATE_URL: ${{ secrets.SERV00_UPDATE_URL }}
          SERV00_UPDATE_TOKEN: ${{ secrets.SERV00_UPDATE_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          cd ${{ github.workspace }}
          set -euo pipefail
          python scripts/main.py \
            --date "${TARGET_DATE}" \
            --count "${ARTICLES_PER_DAY}" \
            --config "${GENERATION_CONFIG}" \
            --providers "${AI_PROVIDERS_CONFIG}" \
            --channels "${CHANNELS_CONFIG}" \
            --content-dir "${CONTENT_DIR}" \
            --channel "${{ matrix.channel }}"
          echo "=== Generated files ==="
          find content/ -name '*.json' -type f 2>/dev/null | head -20
          ls -la content/stories/ 2>/dev/null || echo "content/stories/ not found"
          ls -la content/daily/ 2>/dev/null || echo "content/daily/ not found"
          echo "=== Story codes generated ==="
          ls content/stories/${{ matrix.channel }}-*.json 2>/dev/null | grep -v _prompts | sed 's/.*${{ matrix.channel }}-/${{ matrix.channel }}-/' | sed 's/.json//' || echo "None"

      - name: Generate images & FTP upload (Agnes Image 2.5 Flash)
        if: steps.should_run.outputs.run == 'true' && steps.generate.outputs.generated_count != '0'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          echo "=== Starting Agnes Image Generation for ${{ matrix.channel }} ==="
          python scripts/generate_images_agnes_ftp.py \
            --content-dir "${CONTENT_DIR}" \
            --story-codes "${{ steps.generate.outputs.story_codes }}" \
            --ftp-host "${FTP_HOST}" \
            --ftp-user "${FTP_USER}" \
            --ftp-pass "${FTP_PASS}" \
            --ftp-path "${FTP_PATH}" \
            --site-url "${SITE_URL}"
          echo "=== Agnes Image Generation Completed ==="

      - name: Commit and push generated stories (with image URLs)
        if: steps.should_run.outputs.run == 'true' && steps.generate.outputs.generated_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: generate ${{ steps.generate.outputs.generated_count }} ${{ matrix.channel }} stories for ${{ steps.date.outputs.target_date }}"
            git push
            echo "PUSH OK"
          fi
          echo "=== Verifying push ==="
          git log --oneline -1
          git status

      - name: Verify stories in GitHub
        if: steps.should_run.outputs.run == 'true' && steps.generate.outputs.generated_count != '0'
        run: |
          sleep 3
          for code in $(echo "${{ steps.generate.outputs.story_codes }}" | tr ',' ' '); do
            URL="https://api.github.com/repos/${{ github.repository }}/contents/content/stories/${code}.json?ref=main"
            RESP=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$URL")
            if echo "$RESP" | grep -q '"name"'; then
              echo "VERIFIED: $code"
            else
              echo "NOT FOUND: $code"
            fi
          done

      - name: Validate SERV00_UPDATE_URL
        if: steps.should_run.outputs.run == 'true' && steps.generate.outputs.generated_count != '0'
        run: |
          URL="${{ secrets.SERV00_UPDATE_URL }}"
          if [[ -z "$URL" ]]; then
            echo "SERV00_UPDATE_URL secret not set"
            exit 1
          fi
          if [[ ! "$URL" =~ ^https://.*\.php$ ]]; then
            echo "SERV00_UPDATE_URL must end with .php"
            echo "Current: $URL"
            exit 1
          fi
          echo "SERV00_UPDATE_URL OK: $URL"

      - name: Notify Serv00
        if: steps.should_run.outputs.run == 'true' && steps.generate.outputs.generated_count != '0'
        env:
          SERV00_UPDATE_URL: ${{ secrets.SERV00_UPDATE_URL }}
          SERV00_UPDATE_TOKEN: ${{ secrets.SERV00_UPDATE_TOKEN }}
        run: |
          cd ${{ github.workspace }}
          set -euo pipefail
          python scripts/notify_serv00.py \
            --url "${SERV00_UPDATE_URL}" \
            --token "${SERV00_UPDATE_TOKEN}" \
            --stories "${{ steps.generate.outputs.story_codes }}" \
            --content-dir "${CONTENT_DIR}"

      - name: Summary
        if: steps.should_run.outputs.run == 'true'
        run: |
          echo "## Generation Summary (${{ matrix.channel }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: ${{ steps.date.outputs.target_date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel**: ${{ matrix.channel }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Requested**: ${{ steps.config.outputs.articles_per_day }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Generated**: ${{ steps.generate.outputs.generated_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed**: ${{ steps.generate.outputs.failed_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Provider Used**: ${{ steps.generate.outputs.provider_used }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Stories**: ${{ steps.generate.outputs.story_codes }}" >> $GITHUB_STEP_SUMMARY

  cleanup:
    name: Cleanup Old Workflow Runs
    needs: detect-mode
    if: needs.detect-mode.outputs.do_cleanup == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 5