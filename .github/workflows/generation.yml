name: Daily CH-666 Generation

on:
  schedule:
    # Asia/Taipei (UTC+8): 07:04, 10:06, 13:03, 16:07, 19:02, 01:01
    - cron: '6 23 * * *'   # 07:00 TWT
    - cron: '7 7 * * *'    # 15:00 TWT
    - cron: '8 15 * * *'   # 23:00 TWT 
  workflow_dispatch:
    inputs:
      force_date:
        description: 'Target date YYYY-MM-DD (leave blank for yesterday UTC)'
        required: false
        type: string
permissions:
  contents: write

concurrency:
  group: ch666-daily-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and sync story with illustrations
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check story and illustration secrets
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SERV00_UPDATE_URL: ${{ secrets.SERV00_UPDATE_URL }}
          SERV00_UPDATE_TOKEN: ${{ secrets.SERV00_UPDATE_TOKEN }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python - <<'PY'
          import os, sys
          required = ['NVIDIA_API_KEY','AGNES_API_KEY','SERV00_UPDATE_URL','SERV00_UPDATE_TOKEN',
                      'FTP_HOST','FTP_USER','FTP_PASS','FTP_PATH','SITE_URL']
          missing = [key for key in required if not os.getenv(key)]
          if missing:
              print('Missing GitHub Secrets: ' + ', '.join(missing))
              sys.exit(1)
          print('Required story and illustration secrets are configured; values are not printed.')
          PY

      - name: Determine target date
        id: target
        env:
          FORCE_DATE: ${{ inputs.force_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          value = os.getenv('FORCE_DATE', '').strip()
          if value:
              datetime.strptime(value, '%Y-%m-%d')
              target = value
          else:
              target = (datetime.now(timezone.utc) - timedelta(days=1)).strftime('%Y-%m-%d')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'target_date={target}\n')
          print('Target date:', target)
          PY

      - name: Generate story and illustrations
        id: generate
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          ARTICLES_PER_DAY: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/main.py --date "$TARGET_DATE" --count "$ARTICLES_PER_DAY" --content-dir content

      - name: Commit generated story records
        if: steps.generate.outputs.generated_count != '' && steps.generate.outputs.generated_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/stories/ content/daily/ content/cases/
          if ! git diff --cached --quiet; then
            git commit -m "auto: generate CH stories for ${{ steps.target.outputs.target_date }}"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push rejected; retrying after syncing main (attempt $attempt/3)."
              sleep $((attempt * 3))
            done
            if [ "$pushed" != true ]; then
              echo "Could not push generated stories after three attempts." >&2
              exit 1
            fi
          fi

      - name: Notify Serv00
        if: steps.generate.outputs.generated_count != '' && steps.generate.outputs.generated_count != '0'
        env:
          SERV00_UPDATE_URL: ${{ secrets.SERV00_UPDATE_URL }}
          SERV00_UPDATE_TOKEN: ${{ secrets.SERV00_UPDATE_TOKEN }}
          STORY_CODES: ${{ steps.generate.outputs.story_codes }}
        run: python scripts/notify.py --url "$SERV00_UPDATE_URL" --token "$SERV00_UPDATE_TOKEN" --stories "$STORY_CODES" --content-dir content

      - name: Generation summary
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          GENERATED: ${{ steps.generate.outputs.generated_count }}
          FAILED: ${{ steps.generate.outputs.failed_count }}
          CODES: ${{ steps.generate.outputs.story_codes }}
        run: |
          {
            echo "## CH-666 generation summary"
            echo "- Target date: ${TARGET_DATE:-unknown}"
            echo "- Generated stories: ${GENERATED:-0}"
            echo "- Failed stories: ${FAILED:-0}"
            echo "- Story codes: ${CODES:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  delete-old-runs:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs older than 3 days
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 1

