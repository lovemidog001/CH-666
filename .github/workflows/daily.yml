name: Daily CH-666 Generation

on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:
    inputs:
      count_override:
        description: 'Stories to generate (default 6)'
        required: false
        type: string
        default: '6'
      force_date:
        description: 'Target date YYYY-MM-DD (leave blank for yesterday UTC)'
        required: false
        type: string
      repair_story_code:
        description: 'Repair images for an existing story, e.g. CH-666-0001 (leave blank for normal generation)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ch666-daily-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and sync stories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate required secrets
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SERV00_UPDATE_URL: ${{ secrets.SERV00_UPDATE_URL }}
          SERV00_UPDATE_TOKEN: ${{ secrets.SERV00_UPDATE_TOKEN }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python - <<'PY'
          import os, sys
          required = ['NVIDIA_API_KEY','AGNES_API_KEY','SERV00_UPDATE_URL','SERV00_UPDATE_TOKEN',
                      'FTP_HOST','FTP_USER','FTP_PASS','FTP_PATH','SITE_URL']
          missing = [k for k in required if not os.getenv(k)]
          if missing:
              print('Missing GitHub Secrets: ' + ', '.join(missing))
              sys.exit(1)
          print('Required secrets are configured; values are not printed.')
          PY
      - name: Determine target date
        id: target
        env:
          FORCE_DATE: ${{ github.event.inputs.force_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          value = os.getenv('FORCE_DATE','').strip()
          if value:
              datetime.strptime(value, '%Y-%m-%d')
              target = value
          else:
              target = (datetime.now(timezone.utc)-timedelta(days=1)).strftime('%Y-%m-%d')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'target_date={target}\n')
          print('Target date:', target)
          PY
      - name: Generate stories and images
        id: generate
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.repair_story_code == '' }}
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          ARTICLES_PER_DAY: ${{ github.event.inputs.count_override || '6' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python scripts/main.py --date "$TARGET_DATE" --count "$ARTICLES_PER_DAY" --content-dir content
      - name: Repair images for an existing story
        id: repair
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.repair_story_code != '' }}
        env:
          REPAIR_STORY_CODE: ${{ github.event.inputs.repair_story_code }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python scripts/repair_images.py --story-code "$REPAIR_STORY_CODE" --content-dir content
      - name: Commit generated JSON
        if: (steps.generate.outputs.generated_count != '' && steps.generate.outputs.generated_count != '0') || steps.repair.outputs.generated_count == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/stories/ content/daily/
          if ! git diff --cached --quiet; then
            git commit -m "auto: generate CH stories for ${{ steps.target.outputs.target_date }}"
            git push
          fi
      - name: Notify Serv00
        if: (steps.generate.outputs.generated_count != '' && steps.generate.outputs.generated_count != '0') || steps.repair.outputs.generated_count == '1'
        env:
          SERV00_UPDATE_URL: ${{ secrets.SERV00_UPDATE_URL }}
          SERV00_UPDATE_TOKEN: ${{ secrets.SERV00_UPDATE_TOKEN }}
        run: |
          python scripts/notify.py --url "$SERV00_UPDATE_URL" --token "$SERV00_UPDATE_TOKEN" --stories "${{ steps.generate.outputs.story_codes || steps.repair.outputs.story_codes }}" --content-dir content
      - name: Run summary
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.target_date }}
          GENERATED: ${{ steps.generate.outputs.generated_count || steps.repair.outputs.generated_count }}
          FAILED: ${{ steps.generate.outputs.failed_count || steps.repair.outputs.failed_count }}
          CODES: ${{ steps.generate.outputs.story_codes || steps.repair.outputs.story_codes }}
        run: |
          {
            echo "## CH-666 generation summary"
            echo "- Target date: ${TARGET_DATE:-unknown}"
            echo "- Generated: ${GENERATED:-0}"
            echo "- Failed: ${FAILED:-0}"
            echo "- Story codes: ${CODES:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
